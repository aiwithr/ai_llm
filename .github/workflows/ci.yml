name: ci

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

# Needed so `mkdocs gh-deploy` can push the built site to the gh-pages branch.
permissions:
  contents: write

# Prevent overlapping deploys from racing each other on the gh-pages branch.
concurrency:
  group: pages-gh-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git Credentials
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache MkDocs Material
        uses: actions/cache@v4
        with:
          key: mkdocs-material-${{ hashFiles('mkdocs.yml', 'docs/**/*.md') }}
          path: |
            ~/.cache/pip
            ~/.cache/mkdocs_material
          restore-keys: |
            mkdocs-material-

      - name: Install MkDocs Material
        run: pip install mkdocs-material pymdown-extensions

      - name: Build and deploy to gh-pages
        run: mkdocs gh-deploy --force --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
