name: ci

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install MkDocs Material
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs mkdocs-material pymdown-extensions

      - name: Validate Mermaid loader wiring
        run: |
          test -f docs/javascripts/mermaid-loader.js
          grep -q 'extra_javascript' mkdocs.yml
          test -f site/index.html
          grep -q 'mermaid-loader.js' site/index.html

      - name: Build site (strict)
        run: mkdocs build --strict

      - name: Count Mermaid blocks
        run: |
          BLOCKS=$(grep -rEc '^```mermaid' docs/ | awk -F: '{s+=$2} END{print s}')
          echo "Mermaid blocks: $BLOCKS"
          if [ "$BLOCKS" -lt 1 ]; then
            echo "No Mermaid blocks found in docs/"; exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
