{% extends "base.html" %}

{% block extrahead %}
  <!-- Core SEO & Identity -->
  <meta name="author" content="Rakibul Hassan (রকিবুল হাসান)">
  <meta name="creator" content="Rakibul Hassan">
  <meta name="publisher" content="Rakibul Hassan">
  <meta name="keywords" content="enterprise workflow for businesses, AI workflow, AI for business, enterprise automation, local LLM, SLM, Qwen 2.5, Gemma 3, Temporal.io, Camunda, LangGraph, Windmill, on-premise AI, private AI, ISP NOC automation, banking IT helpdesk, factory handover, Rakibul Hassan, AI author, Link3 Technologies">

  <!-- Open Graph / Facebook -->
  <meta property="og:site_name" content="AI Work Flow for Business">
  <meta property="og:type" content="book">
  <meta property="og:title" content="{% if page and page.meta and page.meta.title %}{{ page.meta.title }}{% elif page and page.title and not page.is_homepage %}{{ page.title }} | AI Work Flow for Business — Enterprise Automation, Without the Cloud{% else %}AI Work Flow for Business — Enterprise Automation, Without the Cloud | By Rakibul Hassan{% endif %}">
  <meta property="og:description" content="{% if page and page.meta and page.meta.description %}{{ page.meta.description }}{% else %}Enterprise automation and AI workflow for businesses without the cloud by AI author Rakibul Hassan. Production workflows, local SLMs, open-source orchestration, zero cloud data leakage.{% endif %}">
  <meta property="og:url" content="{{ page.canonical_url }}">
  <meta property="og:image" content="https://aiwithr.github.io/images/wood-texture-1600x800.jpg">
  <meta property="og:image:alt" content="AI Work Flow for Business by Rakibul Hassan">
  <meta property="og:locale" content="{% if 'bangla' in page.url %}bn_BD{% else %}en_US{% endif %}">

  <!-- Twitter Cards -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:site" content="@raqueeb">
  <meta name="twitter:creator" content="@raqueeb">
  <meta name="twitter:title" content="{% if page and page.meta and page.meta.title %}{{ page.meta.title }}{% elif page and page.title and not page.is_homepage %}{{ page.title }} | AI Work Flow for Business{% else %}AI Work Flow for Business — Enterprise Automation, Without the Cloud | By Rakibul Hassan{% endif %}">

  <meta name="twitter:image" content="https://aiwithr.github.io/images/wood-texture-1600x800.jpg">
  <meta name="twitter:image:alt" content="AI Work Flow for Business by Rakibul Hassan">

      "Government Automation",
      "Telecommunications Policy",

    "@context": "https://schema.org",

    }

  {% if page and page.title and not page.is_homepage %}

  {
    "@context": "https://schema.org",
    "@type": "WebPage",
    "name": "{{ page.title }}",
    "url": "{{ page.canonical_url }}",
    "isPartOf": {
      "@type": "Book",
