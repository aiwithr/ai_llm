{% extends "base.html" %}

{% block site_meta %}
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="author" content="Rakibul Hassan (রকিবুল হাসান)">
  <meta name="creator" content="Rakibul Hassan">
  <meta name="publisher" content="Rakibul Hassan">
  <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1">
  <meta name="keywords" content="AI Work Flow for Business, enterprise workflow for businesses, AI workflow, local LLM, SLM, Qwen 2.5, Gemma 3, Temporal.io, Camunda, LangGraph, Windmill, on-premise AI, private AI, Forward Deployed Engineering, Rakibul Hassan, রকিবুল হাসান, aiwithr">
  <meta name="description" content="{% if page and page.meta and page.meta.description %}{{ page.meta.description | e }}{% elif page and page.title and not page.is_homepage %}{{ page.title | e }} — AI Work Flow for Business by Rakibul Hassan (রকিবুল হাসান). On-premise local SLMs & enterprise workflow orchestration.{% else %}{{ config.site_description | e }}{% endif %}">
  {% if page.canonical_url %}
    <link rel="canonical" href="{{ page.canonical_url }}">
  {% endif %}
  {% if page.previous_page %}
    <link rel="prev" href="{{ page.previous_page.url | url }}">
  {% endif %}
  {% if page.next_page %}
    <link rel="next" href="{{ page.next_page.url | url }}">
  {% endif %}
{% endblock %}

  <meta property="og:type" content="{% if page.is_homepage %}book{% else %}article{% endif %}">
  <meta property="og:title" content="{% if page and page.meta and page.meta.title %}{{ page.meta.title | e }}{% elif page and page.title and not page.is_homepage %}{{ page.title | e }} | AI Work Flow for Business{% else %}AI Work Flow for Business — Enterprise Automation, Without the Cloud | By Rakibul Hassan{% endif %}">

  <meta property="og:url" content="{{ page.canonical_url }}">
  <meta property="og:locale" content="{% if 'bangla' in page.url %}bn_BD{% else %}en_US{% endif %}">
  <meta property="og:image" content="https://aiwithr.github.io/images/wood-texture-1600x800.jpg">
  <meta property="og:image:alt" content="AI Work Flow for Business — Rakibul Hassan">

  <!-- Twitter Cards -->
  <meta name="twitter:card" content="summary_large_image">

  <meta name="twitter:creator" content="@raqueeb">
